<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tiki RecSys — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
/* ═══════════════════════════════════════════════════
   DESIGN SYSTEM — Light, Clean & Intuitive
═══════════════════════════════════════════════════ */
:root {
  /* Nền sáng */
  --bg-0: #f3f4f6; /* Nền toàn trang */
  --bg-1: #ffffff; /* Nền sidebar, panel */
  --bg-2: #ffffff; /* Nền card */
  --bg-3: #f9fafb; /* Nền hover, input, chip */
  --bg-4: #e5e7eb; /* Đường viền mờ */
  --bg-5: #d1d5db; /* Scrollbar, dot */

  --border: #e5e7eb;
  --border-bright: #d1d5db;
  
  /* Màu chủ đạo: Xanh Tiki / Blue hiện đại */
  --violet: #1a94ff; /* Đổi tên biến giữ nguyên nhưng dùng mã màu xanh dương */
  --violet-light: #3b82f6;
  --violet-dim: rgba(26, 148, 255, 0.1);
  --border-accent: rgba(26, 148, 255, 0.3);

  --teal: #059669; /* Xanh lá cho trend/tích cực */
  --teal-dim: rgba(5, 150, 105, 0.1);

  --amber: #f59e0b; /* Vàng cam cho rating */
  --red: #ef4444; /* Đỏ cho discount/lỗi */

  /* Màu chữ */
  --text-0: #111827; /* Tiêu đề chính */
  --text-1: #374151; /* Text thường */
  --text-2: #4b5563; /* Text phụ */
  --text-3: #6b7280; /* Muted text, label */

  --font-head: 'Inter', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;

  --radius-xs: 4px;
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 16px;

  /* Bóng đổ mềm mại (Soft Shadow) */
  --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
  --shadow-violet: 0 4px 12px rgba(26, 148, 255, 0.15);
  --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);

  --sidebar-w: 260px;
  --topbar-h: 64px;

  --gradient-violet: linear-gradient(135deg, #1a94ff, #2563eb);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  background: var(--bg-0);
  color: var(--text-1);
  min-height: 100vh;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

/* ── LAYOUT ── */
.layout { display: flex; min-height: 100vh; }

/* ── SIDEBAR ── */
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: var(--bg-1);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: fixed; top: 0; left: 0; bottom: 0;
  z-index: 100;
}

.sidebar-logo {
  padding: 24px 20px 20px;
  border-bottom: 1px solid var(--border);
}

.brand {
  font-family: var(--font-head);
  font-size: 22px; font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text-0);
  display: flex; align-items: center; gap: 4px;
}
.brand-accent { color: var(--violet); }

.brand-badge {
  display: inline-flex; align-items: center;
  background: var(--violet-dim); 
  color: var(--violet-light); font-family: var(--font-mono);
  font-size: 10px; font-weight: 600;
  padding: 3px 8px; border-radius: 6px; margin-left: 8px;
  text-transform: uppercase;
}

.sub {
  font-size: 11px; color: var(--text-3);
  margin-top: 6px; font-weight: 500;
}

.sidebar-nav { flex: 1; padding: 20px 12px; overflow-y: auto; }

.nav-section-label {
  font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
  text-transform: uppercase; color: var(--text-3);
  padding: 16px 12px 8px;
}

.nav-item {
  display: flex; align-items: center;
  padding: 10px 12px; border-radius: var(--radius-sm);
  cursor: pointer; transition: all 0.2s ease;
  font-size: 14px; font-weight: 500;
  color: var(--text-2);
  margin-bottom: 4px;
  gap: 12px;
}

.nav-item .nav-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--bg-4); flex-shrink: 0;
  transition: all 0.2s;
}

.nav-item:hover {
  background: var(--bg-3);
  color: var(--text-0);
}

.nav-item.active {
  background: var(--violet-dim);
  color: var(--violet);
  font-weight: 600;
}
.nav-item.active .nav-dot { background: var(--violet); }

.sidebar-footer {
  padding: 16px;
  border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 10px;
  background: var(--bg-3);
}

.status-pill {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg-1); border-radius: var(--radius-sm);
  padding: 10px 12px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-card);
}

.status-pill-label { font-size: 13px; color: var(--text-0); font-weight: 600; }
.status-pill-sub { font-size: 11px; color: var(--text-3); font-family: var(--font-mono); margin-top: 2px;}

.status-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--text-3); flex-shrink: 0;
}
.status-dot.online  { background: var(--teal); box-shadow: 0 0 0 3px var(--teal-dim); }
.status-dot.offline { background: var(--red); box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1); }
.status-dot.checking { background: var(--violet); animation: pulse 1.2s ease infinite; }
@keyframes pulse { 0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(26,148,255,0.2)} 50%{opacity:0.6;box-shadow:0 0 0 4px rgba(26,148,255,0)} }

/* ── MAIN ── */
.main {
  margin-left: var(--sidebar-w); flex: 1;
  display: flex; flex-direction: column;
  min-height: 100vh;
}

.topbar {
  background: rgba(255, 255, 255, 0.9);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  height: var(--topbar-h);
  display: flex; align-items: center;
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.topbar-title {
  font-family: var(--font-head);
  font-size: 18px; font-weight: 700;
  color: var(--text-0);
}

.topbar-sub {
  font-size: 12px; color: var(--text-2);
  font-family: var(--font-mono); margin-left: 16px;
  background: var(--bg-3); padding: 4px 10px;
  border-radius: 6px; border: 1px solid var(--border);
}

.topbar-actions { margin-left: auto; }

.content {
  flex: 1; padding: 32px;
  animation: fadeIn 0.4s ease;
  max-width: 1600px;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ── CARDS ── */
.card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-card);
  transition: box-shadow 0.2s;
}
.card:hover { box-shadow: var(--shadow); }

.card-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
  background: #ffffff;
}

.card-title {
  font-family: var(--font-head);
  font-size: 16px; font-weight: 600;
  color: var(--text-0);
}
.card-sub { font-size: 12px; color: var(--text-3); margin-left: auto; font-family: var(--font-mono); }
.card-body { padding: 20px; }

/* ── KPI / STAT CARDS ── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px; margin-bottom: 24px;
}

.stat-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px 20px;
  position: relative;
  box-shadow: var(--shadow-card);
  transition: transform 0.2s, box-shadow 0.2s;
}
.stat-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0;
  height: 4px; background: var(--bg-4);
}
.stat-card.highlight::before { background: var(--violet); }
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }

.stat-value {
  font-size: 32px; font-weight: 700;
  color: var(--text-0);
  line-height: 1.2; margin-bottom: 8px;
}
.stat-card.highlight .stat-value { color: var(--violet); }

.stat-label {
  font-size: 13px; color: var(--text-2); font-weight: 500;
}

.stat-trend {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 600;
  margin-top: 12px; padding: 4px 8px;
  border-radius: 6px;
}
.trend-up { color: var(--teal); background: var(--teal-dim); }
.trend-neutral { color: var(--text-2); background: var(--bg-3); }

/* ── CHARTS ── */
.charts-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 20px; margin-bottom: 24px;
}
.chart-container { padding: 16px; background: #fff;}

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 18px; border-radius: var(--radius-sm);
  font-family: var(--font-body); font-size: 14px; font-weight: 600;
  cursor: pointer; border: 1px solid transparent;
  transition: all 0.2s; 
}
.btn-primary {
  background: var(--violet); color: white;
  box-shadow: 0 2px 4px rgba(26,148,255,0.2);
}
.btn-primary:hover {
  background: var(--violet-light);
  transform: translateY(-1px);
  box-shadow: 0 4px 8px rgba(26,148,255,0.3);
}

.btn-secondary {
  background: white; color: var(--text-1);
  border-color: var(--border-bright);
  box-shadow: var(--shadow-card);
}
.btn-secondary:hover { background: var(--bg-3); color: var(--text-0); }

.btn-ghost {
  background: transparent; color: var(--text-2);
}
.btn-ghost:hover { background: var(--bg-3); color: var(--text-0); }
.btn-sm { padding: 6px 12px; font-size: 13px; }

/* ── INPUTS ── */
.input {
  width: 100%;
  background: #ffffff;
  border: 1px solid var(--border-bright);
  color: var(--text-0);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-family: var(--font-body); font-size: 14px;
  outline: none;
  transition: all 0.2s;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.02);
}
.input::placeholder { color: var(--text-3); }
.input:focus {
  border-color: var(--violet);
  box-shadow: 0 0 0 3px var(--violet-dim);
}
select.input option { background: #ffffff; color: var(--text-0); }

.label {
  display: block; font-size: 12px; font-weight: 600;
  color: var(--text-2); margin-bottom: 8px;
}

.form-row { margin-bottom: 16px; }

/* ── TABLE ── */
.table-wrap { overflow-x: auto; background: white;}
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th {
  text-align: left; padding: 14px 20px;
  font-size: 12px; font-weight: 600;
  color: var(--text-2); border-bottom: 1px solid var(--border);
  background: var(--bg-3); white-space: nowrap;
}
td {
  padding: 14px 20px; border-bottom: 1px solid var(--border);
  color: var(--text-1); vertical-align: middle;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--bg-3); }
.td-name { font-weight: 600; color: var(--text-0); }
.td-price { font-weight: 600; color: var(--violet); }

/* ── BADGE ── */
.badge {
  display: inline-flex; align-items: center;
  padding: 4px 10px; border-radius: 6px;
  font-size: 12px; font-weight: 500;
}
.badge-blue { background: var(--violet-dim); color: var(--violet); }
.badge-gray { background: var(--bg-4); color: var(--text-2); }
.badge-green { background: var(--teal-dim); color: var(--teal); }

/* ── STARS ── */
.stars { color: var(--amber); font-size: 14px; }
.stars-num { color: var(--text-2); font-size: 12px; margin-left: 4px; font-weight: 500;}

/* ── SCORE BAR ── */
.score-bar-wrap { display: flex; align-items: center; gap: 10px; }
.score-bar {
  flex: 1; height: 6px;
  background: var(--bg-4);
  border-radius: 3px; overflow: hidden;
}
.score-bar-fill {
  height: 100%;
  background: var(--violet);
  border-radius: 3px;
  transition: width 0.6s ease;
}
.score-num { font-family: var(--font-mono); font-size: 12px; color: var(--text-2); width: 36px; }

/* ── PRODUCT GRID ── */
.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 20px;
}

.product-card {
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: var(--shadow-card);
  display: flex; flex-direction: column;
}
.product-card:hover {
  border-color: var(--border-bright);
  transform: translateY(-4px);
  box-shadow: var(--shadow-hover);
}

.product-card .p-img {
  aspect-ratio: 1;
  background: white;
  display: flex; align-items: center; justify-content: center;
  font-size: 40px;
  position: relative; overflow: hidden;
  padding: 16px;
}
.product-card .p-img img {
  width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply;
}

.product-card .p-favorite {
  position: absolute; top: 12px; right: 12px;
  width: 32px; height: 32px;
  background: rgba(255,255,255,0.9);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; cursor: pointer;
  border: 1px solid var(--border);
  color: var(--text-3); transition: all 0.2s;
  box-shadow: var(--shadow-card);
}
.product-card .p-favorite:hover { color: var(--red); border-color: var(--red); }
.product-card .p-favorite.liked { color: var(--red); background: #fef2f2; border-color: #fecaca; }

.product-card .p-cart {
  position: absolute; bottom: 12px; right: 12px;
  width: 36px; height: 36px;
  background: var(--violet); color: white;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 2px 4px rgba(26,148,255,0.3);
  opacity: 0; transform: translateY(10px);
}
.product-card:hover .p-cart { opacity: 1; transform: translateY(0); }
.product-card .p-cart:hover { background: var(--violet-light); transform: scale(1.1); }

.product-card .p-body { padding: 16px; border-top: 1px solid var(--bg-3); flex: 1; display: flex; flex-direction: column; justify-content: flex-end;}
.product-card .p-name {
  font-size: 13px; font-weight: 500; color: var(--text-1);
  line-height: 1.5; margin-bottom: 8px;
  display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
}
.product-card .p-price {
  font-size: 16px; font-weight: 700; color: var(--text-0);
}
.product-card .p-rating { font-size: 12px; margin: 4px 0 8px; }
.product-card .p-original-price {
  font-size: 12px; color: var(--text-3); text-decoration: line-through; margin-right: 6px;
}

/* ── DISCOUNT BADGE ── */
.p-discount-badge {
  position: absolute; top: 12px; left: 12px;
  background: var(--red); color: white;
  font-size: 11px; font-weight: 700;
  padding: 3px 6px; border-radius: var(--radius-xs);
}

/* ── PAGINATION ── */
.pagination {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; margin-top: 32px;
}
.page-btn {
  width: 36px; height: 36px;
  background: white; border: 1px solid var(--border-bright);
  border-radius: var(--radius-sm); cursor: pointer;
  font-size: 14px; font-weight: 500; color: var(--text-1);
  transition: all 0.2s; box-shadow: var(--shadow-card);
}
.page-btn:hover:not(:disabled) { border-color: var(--violet); color: var(--violet); }
.page-btn.active {
  background: var(--violet); color: white; border-color: var(--violet);
}
.page-btn:disabled { opacity: 0.5; cursor: not-allowed; background: var(--bg-3); }

/* ── CAROUSEL ── */
.carousel-wrap { position: relative; padding: 0 10px; }
.carousel {
  display: flex; gap: 20px; overflow-x: auto;
  padding: 10px 0 20px 0; scroll-snap-type: x mandatory;
  scrollbar-width: none;
}
.carousel::-webkit-scrollbar { display: none; }
.carousel > * { scroll-snap-align: start; flex-shrink: 0; }

.carousel-btn {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 40px; height: 40px;
  background: white; border: 1px solid var(--border);
  border-radius: 50%; cursor: pointer;
  font-size: 18px; color: var(--text-1);
  transition: all 0.2s; z-index: 10; box-shadow: var(--shadow);
}
.carousel-btn:hover { color: var(--violet); border-color: var(--violet); }
.carousel-btn.prev { left: -10px; }
.carousel-btn.next { right: -10px; }

.carousel-card {
  width: 200px;
  background: white; border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; cursor: pointer;
  transition: all 0.2s; box-shadow: var(--shadow-card);
}
.carousel-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); border-color: var(--border-bright); }
.carousel-card .cc-img {
  aspect-ratio: 1; background: white;
  display: flex; align-items: center; justify-content: center;
  font-size: 30px; border-bottom: 1px solid var(--bg-3); padding: 16px;
}
.carousel-card .cc-img img { width: 100%; height: 100%; object-fit: contain; }
.carousel-card .cc-body { padding: 12px 16px; }
.carousel-card .cc-name {
  font-size: 13px; font-weight: 500; color: var(--text-1);
  line-height: 1.4; margin-bottom: 6px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.carousel-card .cc-price { font-weight: 700; font-size: 14px; color: var(--text-0); }

/* ── EMPTY / LOADING ── */
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-2); }
.empty-state-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.8; }
.empty-state-title { font-size: 16px; color: var(--text-0); margin-bottom: 8px; font-weight: 600; }
.empty-state-sub { font-size: 14px; color: var(--text-3); }

.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--bg-4);
  border-top-color: var(--violet);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── TOAST ── */
#toast-container {
  position: fixed; bottom: 32px; right: 32px;
  z-index: 9999; display: flex; flex-direction: column; gap: 12px;
}
.toast {
  background: white; border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 20px; font-size: 14px; font-weight: 500; color: var(--text-0);
  box-shadow: var(--shadow-hover);
  animation: toastIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes toastIn { from { opacity:0; transform: translateX(30px); } to { opacity:1; transform: none; } }
.toast.success { border-left: 4px solid var(--teal); }
.toast.error   { border-left: 4px solid var(--red); }

/* ── DETAIL PANEL ── */
.detail-overlay {
  position: fixed; inset: 0;
  background: rgba(17, 24, 39, 0.4);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  z-index: 200; display: none;
  align-items: flex-start; justify-content: flex-end;
}
.detail-overlay.open { display: flex; }
.detail-panel {
  width: 500px; max-width: 100vw; height: 100vh;
  background: var(--bg-1);
  border-left: 1px solid var(--border);
  overflow-y: auto; box-shadow: -4px 0 24px rgba(0,0,0,0.1);
  animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes slideIn { from { transform: translateX(100%); } to { transform: none; } }

.detail-panel-head {
  padding: 24px; border-bottom: 1px solid var(--border);
  display: flex; gap: 20px;
  position: sticky; top: 0; z-index: 10;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(10px);
}
.detail-close {
  margin-left: auto; cursor: pointer;
  font-size: 20px; color: var(--text-2); transition: all 0.2s;
  width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; background: var(--bg-3);
}
.detail-close:hover { color: var(--text-0); background: var(--bg-4); }
.detail-body { padding: 24px; }
.detail-image {
  width: 100px; height: 100px;
  background: white; border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 36px; flex-shrink: 0; padding: 10px;
}
.detail-prop {
  background: white; border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 12px 16px; flex: 1;
}
.detail-prop-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; font-weight: 600; margin-bottom: 6px; }
.detail-prop-value { font-size: 15px; font-weight: 600; color: var(--text-0); }

/* ── TWO-COL ── */
.two-col { display: grid; grid-template-columns: 400px 1fr; gap: 24px; }
.two-col.wide { grid-template-columns: 450px 1fr; }

/* ── CHIP / CATEGORY ── */
.chip {
  padding: 8px 16px;
  background: white; border: 1px solid var(--border-bright);
  border-radius: 20px;
  font-size: 13px; color: var(--text-1);
  cursor: pointer; transition: all 0.2s;
  white-space: nowrap; font-weight: 500;
  flex-shrink: 0; box-shadow: var(--shadow-card);
}
.chip:hover { background: var(--bg-3); border-color: var(--text-3); color: var(--text-0); }
.chip.active {
  background: var(--violet); border-color: var(--violet); color: white; box-shadow: 0 2px 6px rgba(26,148,255,0.3);
}

/* ── AUTOCOMPLETE ── */
.autocomplete-wrap { position: relative; }
.autocomplete-dropdown {
  display: none;
  position: absolute; top: calc(100% + 8px); left: 0; right: 0; z-index: 300;
  background: white; border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-hover);
  max-height: 300px; overflow-y: auto;
}
.autocomplete-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; cursor: pointer; font-size: 14px;
  border-bottom: 1px solid var(--border);
  transition: background 0.2s;
}
.autocomplete-item:last-child { border-bottom: none; }
.autocomplete-item:hover { background: var(--bg-3); }
.ai-name { font-weight: 600; color: var(--text-0); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ai-sub  { font-size: 12px; color: var(--text-3); margin-top: 2px;}
.ai-product-img {
  width: 44px; height: 44px; background: white;
  border-radius: var(--radius-xs); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0; overflow: hidden; padding: 4px;
}
.ai-product-img img { width: 100%; height: 100%; object-fit: contain; }

.selected-item-box {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; margin-top: 12px;
  background: var(--violet-dim); border: 1px solid var(--border-accent);
  border-radius: var(--radius-sm);
}
.selected-item-box .si-img {
  width: 40px; height: 40px; background: white;
  border-radius: var(--radius-xs); display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0; overflow: hidden; border: 1px solid var(--border); padding: 4px;
}
.selected-item-box .si-img img { width: 100%; height: 100%; object-fit: contain; }
.selected-item-box .si-name { font-size: 14px; font-weight: 600; color: var(--text-0); }
.selected-item-box .si-id   { font-size: 12px; color: var(--violet); font-family: var(--font-mono); margin-top: 2px;}

/* ── CAT SCROLL ── */
.cat-scroll::-webkit-scrollbar { display: none; }
.cat-scroll { scrollbar-width: none; padding-bottom: 4px;}

/* ── SKELETON ── */
.skeleton {
  background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s ease infinite;
  border-radius: var(--radius-xs);
}
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* ── RESPONSIVE ── */
@media (max-width: 1024px) {
  .sidebar { transform: translateX(-100%); }
  .main { margin-left: 0; }
  .two-col, .two-col.wide { grid-template-columns: 1fr; }
  .charts-grid { grid-template-columns: 1fr; }
}

/* ── PAGE INFO ── */
.page-info { color: var(--text-2); font-size: 14px; padding: 0 8px; font-weight: 500;}

/* ── RANGE INPUT ── */
input[type="range"] {
  appearance: none;
  -webkit-appearance: none;
  width: 100%; height: 6px;
  background: var(--bg-4); border-radius: 3px; outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  appearance: none;
  -webkit-appearance: none;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--violet);
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(26,148,255,0.4);
  border: 3px solid white;
}

/* ── PRODUCT COUNT LINE ── */
.product-count { font-size: 13px; font-weight: 500; color: var(--text-2); margin-bottom: 16px; }
</style>
</head>
<body>
<div class="layout">

<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="brand">
      Tiki<span class="brand-accent">Rec</span>
      <span class="brand-badge">v2</span>
    </div>
    <div class="sub">Recommendation System</div>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-section-label">Dữ liệu</div>
    <div class="nav-item" data-page="stats" onclick="navigate('stats')">
      <span class="nav-dot"></span>Thống kê hệ thống
    </div>
    <div class="nav-item active" data-page="products" onclick="navigate('products')">
      <span class="nav-dot"></span>Danh sách sản phẩm
    </div>

    <div class="nav-section-label">Recommendation</div>
    <div class="nav-item" data-page="recommend-user" onclick="navigate('recommend-user')">
      <span class="nav-dot"></span>Gợi ý cá nhân hoá
    </div>
    <div class="nav-item" data-page="recommend-similar" onclick="navigate('recommend-similar')">
      <span class="nav-dot"></span>Sản phẩm tương tự
    </div>

    <div class="nav-section-label">Tương tác</div>
    <div class="nav-item" data-page="interactions" onclick="navigate('interactions')">
      <span class="nav-dot"></span>Ghi nhận tương tác
    </div>
  </nav>

  <div class="sidebar-footer">
    <div class="status-pill">
      <div class="status-dot checking" id="ml-dot"></div>
      <div>
        <div class="status-pill-label">ML API</div>
        <div class="status-pill-sub" id="ml-port">:8000</div>
      </div>
    </div>
    <div class="status-pill">
      <div class="status-dot checking" id="db-dot"></div>
      <div>
        <div class="status-pill-label">MongoDB</div>
        <div class="status-pill-sub" id="db-info">–</div>
      </div>
    </div>
  </div>
</aside>

<main class="main">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:0">
      <span class="topbar-title" id="page-title">Danh sách sản phẩm</span>
      <span class="topbar-sub" id="page-sub">UC-01 / GET /api/products</span>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-secondary btn-sm" onclick="refreshCurrent()">↻ Làm mới</button>
    </div>
  </header>
  <div class="content" id="page-content"></div>
</main>
</div>

<div class="detail-overlay" id="detail-overlay" onclick="closeDetail(event)">
  <div class="detail-panel" id="detail-panel">
    <div id="detail-content"></div>
  </div>
</div>
<div id="toast-container"></div>

<script>
/* ─────────────────────────────────────────────
   STATE
───────────────────────────────────────────── */
const state = {
  currentPage: 'products',
  products: { page:1, limit:20, category:'', search:'', sort_by:'popularity_score', data:null },
  categories: [],
  charts: {}
};

/* ─────────────────────────────────────────────
   NAVIGATION
───────────────────────────────────────────── */
const PAGE_META = {
  stats:              { title:'Thống kê hệ thống',    sub:'UC-06 / GET /api/stats' },
  products:           { title:'Danh sách sản phẩm',   sub:'UC-01 / GET /api/products' },
  'recommend-user':   { title:'Gợi ý cá nhân hoá',    sub:'UC-03 / GET /api/recommend/user/:id' },
  'recommend-similar':{ title:'Sản phẩm tương tự',    sub:'UC-04 / GET /api/recommend/similar/:id' },
  interactions:       { title:'Ghi nhận tương tác',   sub:'UC-05 / POST /api/interactions' }
};

function navigate(page) {
  Object.values(state.charts).forEach(c => c?.destroy?.());
  state.charts = {};
  state.currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
  const m = PAGE_META[page];
  document.getElementById('page-title').textContent = m.title;
  document.getElementById('page-sub').textContent = m.sub;
  const renderFn = {
    stats: renderStats,
    products: renderProducts,
    'recommend-user': renderRecommendUser,
    'recommend-similar': renderRecommendSimilar,
    interactions: renderInteractions
  }[page];
  if (renderFn) renderFn();
}

async function refreshCurrent() { await navigate(state.currentPage); }

/* ─────────────────────────────────────────────
   API
───────────────────────────────────────────── */
async function api(path, opts = {}) {
  const r = await fetch(path, { headers:{ 'Content-Type':'application/json' }, ...opts });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || data.detail || `HTTP ${r.status}`);
  return data;
}

/* ─────────────────────────────────────────────
   UTILS
───────────────────────────────────────────── */
function fmtPrice(v) { return v==null ? '–' : new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND'}).format(v); }
function fmtNum(n)   { return n==null ? '–' : new Intl.NumberFormat('vi-VN').format(n); }
function getRating(p){ return p.rating_avg ?? p.rating ?? null; }
function stars(r)    { if(!r) return '–'; const f=Math.round(r); return '★'.repeat(Math.min(f,5))+'☆'.repeat(Math.max(0,5-f)); }
function calcDiscount(p) {
  if (p.discount_pct && p.discount_pct>0) return Math.round(p.discount_pct);
  if (p.original_price && p.price && p.original_price>p.price)
    return Math.round((1-p.price/p.original_price)*100);
  return 0;
}

function emptyState(title, sub) {
  return `<div class="empty-state">
    <div class="empty-state-icon">📄</div>
    <div class="empty-state-title">${title}</div>
    <div class="empty-state-sub">${sub}</div>
  </div>`;
}

function loading(msg) {
  return `<div style="text-align:center;padding:80px 20px;">
    <div class="spinner" style="margin:0 auto 16px;"></div>
    <div style="font-size:14px;color:var(--text-2);font-weight:500;">${msg}</div>
  </div>`;
}

function skeletonCards(n=10) {
  return Array(n).fill().map(()=>`
    <div class="product-card" style="border:none; box-shadow:none;">
      <div class="p-img skeleton" style="background:#f3f4f6;"></div>
      <div class="p-body">
        <div class="skeleton" style="height:14px;width:85%;margin-bottom:10px;"></div>
        <div class="skeleton" style="height:14px;width:55%;margin-bottom:12px;"></div>
        <div class="skeleton" style="height:18px;width:40%;"></div>
      </div>
    </div>`).join('');
}

function toast(msg, type='success') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}

/* ─────────────────────────────────────────────
   INTERACTION
───────────────────────────────────────────── */
let demoUserId = localStorage.getItem('demo_user_id') || 'user_'+Math.random().toString(36).substr(2,8);
localStorage.setItem('demo_user_id', demoUserId);

async function sendInteraction(productId, action, rating=null) {
  try {
    const payload = { user_id:demoUserId, product_id:productId, action, source:'frontend' };
    if (rating) payload.rating = rating;
    await api('/api/interactions', { method:'POST', body:JSON.stringify(payload) });
    toast(`Đã ${action==='favorite'?'thích':action==='add_to_cart'?'thêm vào giỏ':'mua'} sản phẩm`);
  } catch(e) { toast('Lỗi: '+e.message,'error'); }
}

/* ─────────────────────────────────────────────
   DETAIL PANEL
───────────────────────────────────────────── */
function openDetail(html) {
  document.getElementById('detail-content').innerHTML = html;
  document.getElementById('detail-overlay').classList.add('open');
}
function closeDetail(e) {
  if (e.target===document.getElementById('detail-overlay') || e.target.closest('.detail-close'))
    document.getElementById('detail-overlay').classList.remove('open');
}

async function showProductDetail(pid) {
  openDetail(loading('Đang tải chi tiết...'));
  try {
    const p = await api(`/api/products/${pid}`);
    const rating  = getRating(p);
    const desc    = (p.description && p.description.trim()) ? p.description : null;
    const discount = calcDiscount(p);

    const reviewsHtml = (p.reviews && p.reviews.length) ? `
      <div style="margin-top:24px;">
        <div class="detail-prop-label" style="margin-bottom:12px;">Khách hàng đánh giá (${p.reviews.length})</div>
        ${p.reviews.map(r => {
          const sentimentFromRating = r.rating<=2?'negative':r.rating<=3.5?'neutral':'positive';
          const displaySentiment = r.rating ? sentimentFromRating : r.sentiment;
          const sentimentColor = displaySentiment==='positive'?'var(--teal)':displaySentiment==='negative'?'var(--red)':'var(--text-3)';
          const sentimentBg = displaySentiment==='positive'?'var(--teal-dim)':displaySentiment==='negative'?'rgba(239,68,68,0.1)':'var(--bg-3)';
          const sentimentLabel = displaySentiment==='positive'?'Tích cực':displaySentiment==='negative'?'Tiêu cực':'Trung lập';
          const displayName = r.user_name || r.user_id;
          return `<div style="border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;background:white;">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:${r.review_text?'10':'0'}px;">
              <span style="font-size:14px;font-weight:600;color:var(--text-0);">${displayName}</span>
              ${r.rating?`<span style="color:var(--amber);font-size:14px;">${stars(r.rating)} <span style="font-size:12px;color:var(--text-2);font-weight:500;">${r.rating.toFixed(1)}</span></span>`:''}
              ${r.sentiment?`<span style="font-size:11px;padding:3px 8px;border-radius:6px;background:${sentimentBg};color:${sentimentColor};font-weight:600;">${sentimentLabel}</span>`:''}
              <span style="margin-left:auto;font-size:12px;color:var(--text-3);">${new Date(r.timestamp).toLocaleDateString('vi-VN')}</span>
            </div>
            ${r.review_text?`<div style="font-size:14px;color:var(--text-1);line-height:1.6;border-top:1px solid var(--border);padding-top:12px;">${r.review_text}</div>`:''}
          </div>`;
        }).join('')}
      </div>`
    : `<div style="margin-top:20px;padding:24px;background:var(--bg-3);border-radius:12px;font-size:14px;color:var(--text-2);font-weight:500;text-align:center;">Chưa có đánh giá nào</div>`;

    openDetail(`
      <div class="detail-panel-head">
        <div class="detail-image" style="position:relative;">
          ${p.image_url?`<img src="${p.image_url}" style="width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;">`:'📦'}
          ${discount>0?`<div class="p-discount-badge" style="position:absolute;top:8px;left:8px;">-${discount}%</div>`:''}
        </div>
        <div style="flex:1">
          <div style="font-weight:700;font-size:18px;color:var(--text-0);line-height:1.4;margin-bottom:8px;">${p.name||pid}</div>
          <span class="badge badge-gray">${p.category||'Khác'}</span>
        </div>
        <div class="detail-close" onclick="closeDetail(event)">✕</div>
      </div>
      <div class="detail-body">
        <div style="display:flex;gap:12px;margin-bottom:20px;">
          <div class="detail-prop">
            <div class="detail-prop-label">Giá bán</div>
            <div class="detail-prop-value" style="color:var(--text-0);font-size:18px;">${fmtPrice(p.price)}${p.original_price&&p.original_price>p.price?`<span style="font-size:13px;color:var(--text-3);text-decoration:line-through;margin-left:8px;font-weight:400;">${fmtPrice(p.original_price)}</span>`:''}${discount>0?`<span style="background:var(--red);color:white;font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;margin-left:8px;">-${discount}%</span>`:''}</div>
          </div>
          <div class="detail-prop">
            <div class="detail-prop-label">Đánh giá</div>
            <div class="detail-prop-value">${rating?`<span style="color:var(--amber)">${stars(rating)}</span> <span style="font-size:14px;color:var(--text-1);">${rating.toFixed(1)}/5</span>`:'<span style="color:var(--text-3);font-size:14px;">Chưa có</span>'}</div>
          </div>
          ${p.rating_count?`<div class="detail-prop"><div class="detail-prop-label">Lượt đánh giá</div><div class="detail-prop-value">${fmtNum(p.rating_count)}</div></div>`:''}
        </div>
        <div style="margin-bottom:24px;">
          <div class="detail-prop-label">Mô tả sản phẩm</div>
          <div style="font-size:14px;color:${desc?'var(--text-1)':'var(--text-3)'};line-height:1.6;">${desc||'Sản phẩm chưa có mô tả.'}</div>
        </div>
        <div style="display:flex;gap:12px;margin-bottom:24px;">
          <button class="btn btn-secondary" style="flex:1;justify-content:center;" onclick="closeDetail(event); navigate('recommend-similar'); setTimeout(()=>{document.getElementById('similar-pid').value='${pid}'; fetchSimilar()},300)">Sản phẩm tương tự</button>
          <button class="btn btn-primary" style="flex:1;justify-content:center;" onclick="sendInteraction('${pid}','purchase'); closeDetail(event)">Mua ngay</button>
        </div>
        ${reviewsHtml}
      </div>
    `);
  } catch(e) { toast('Lỗi tải chi tiết: '+e.message,'error'); }
}

/* ─────────────────────────────────────────────
   UC-06 STATS
───────────────────────────────────────────── */
async function renderStats() {
  const el = document.getElementById('page-content');
  el.innerHTML = loading('Đang tải thống kê...');
  try {
    const d = await api('/api/stats');
    const totals  = d.totals || {};
    const topProds = d.top_products || [];
    const cats    = (d.categories||[]).slice(0,8);
    const ints    = d.interactions || [];

    el.innerHTML = `
      <div class="stats-grid">
        <div class="stat-card highlight">
          <div class="stat-value">${fmtNum(totals.products)}</div>
          <div class="stat-label">Tổng sản phẩm</div>
          <div class="stat-trend trend-neutral">Trong kho dữ liệu</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${fmtNum(totals.users)}</div>
          <div class="stat-label">Khách hàng</div>
          <div class="stat-trend trend-up">↑ Đang hoạt động</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${fmtNum(totals.interactions)}</div>
          <div class="stat-label">Lượt tương tác</div>
          <div class="stat-trend trend-up">↑ Tổng hành vi</div>
        </div>
        <div class="stat-card" style="${d.ml_api?.status==='ok'?'border-left:4px solid var(--teal);':'border-left:4px solid var(--red);'}">
          <div class="stat-value" style="color:${d.ml_api?.status==='ok'?'var(--teal)':'var(--red)'}">${d.ml_api?.status==='ok'?'Online':'Offline'}</div>
          <div class="stat-label">Trạng thái ML API</div>
        </div>
      </div>
      <div class="charts-grid">
        <div class="card">
          <div class="card-header"><div class="card-title">Top sản phẩm</div></div>
          <div class="chart-container"><canvas id="chart-top" height="220"></canvas></div>
        </div>
        <div class="card">
          <div class="card-header"><div class="card-title">Phân bổ danh mục</div></div>
          <div class="chart-container"><canvas id="chart-cats" height="220"></canvas></div>
        </div>
        <div class="card">
          <div class="card-header"><div class="card-title">Phân bổ tương tác</div></div>
          <div class="chart-container"><canvas id="chart-ints" height="220"></canvas></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">Top 5 sản phẩm nổi bật</div></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>#</th><th>Sản phẩm</th><th>Danh mục</th><th>Giá</th><th>Rating</th><th>Độ phổ biến</th></tr></thead>
            <tbody>
              ${topProds.map((p,i)=>`
                <tr onclick="showProductDetail('${p.product_id}')" style="cursor:pointer">
                  <td style="color:var(--text-3);font-family:var(--font-mono)">${i+1}</td>
                  <td class="td-name">${p.name||p.product_id}</td>
                  <td><span class="badge badge-gray">${p.category||'–'}</span></td>
                  <td class="td-price">${fmtPrice(p.price)}</td>
                  <td><span style="color:var(--amber);font-size:16px;">${stars(getRating(p))}</span> <span style="font-size:13px;color:var(--text-2);font-weight:500;">${getRating(p)?.toFixed(1)||''}</span></td>
                  <td><div class="score-bar-wrap"><div class="score-bar"><div class="score-bar-fill" style="width:${(p.popularity_score||0)*100}%"></div></div><div class="score-num">${p.popularity_score?.toFixed(2)||''}</div></div></td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;

    // CHUYỂN CHART.JS SANG LIGHT MODE COLORS
    const chartDefaults = {
      color: '#6b7280', // text-3
      gridColor: '#e5e7eb' // border
    };

    if (topProds.length) {
      new Chart(document.getElementById('chart-top'), {
        type:'bar',
        data:{
          labels: topProds.map(p=>p.name?.slice(0,18)),
          datasets:[{ data: topProds.map(p=>p.popularity_score||0), backgroundColor:'#1a94ff', hoverBackgroundColor:'#3b82f6', borderRadius:4 }]
        },
        options:{
          indexAxis:'y',
          plugins:{ legend:{display:false} },
          scales:{
            x:{ grid:{color:chartDefaults.gridColor}, ticks:{color:chartDefaults.color,font:{family:'Inter',size:11}} },
            y:{ grid:{display:false}, ticks:{color:chartDefaults.color,font:{family:'Inter',size:12, weight:'500'}} }

function setCat(cat) { 
  state.products.category=cat; state.products.page=1; 
  document.querySelectorAll('.chip').forEach(el => {
    el.classList.toggle('active', (cat==='' && el.textContent==='Tất cả danh mục') || el.textContent===cat);
  });
  fetchProducts(); 
}
function applyProductFilters() {
  state.products.search  = document.getElementById('search-input').value;
  state.products.sort_by = document.getElementById('sort-select').value;
  state.products.page=1; fetchProducts();
}

async function fetchProducts() {
  const area = document.getElementById('products-area');
  if(!area) return;
  area.innerHTML = `<div class="product-grid">${skeletonCards(10)}</div>`;
  try {
    const params = new URLSearchParams({ page:state.products.page, limit:state.products.limit, sort_by:state.products.sort_by });
    if(state.products.category) params.set('category', state.products.category);
    if(state.products.search)   params.set('search', state.products.search);
    const d = await api(`/api/products?${params}`);
    if(!d.products.length) { area.innerHTML = emptyState('Không tìm thấy sản phẩm','Thử thay đổi bộ lọc hoặc từ khóa tìm kiếm'); return; }
    area.innerHTML = `
      <div class="product-count">Hiển thị ${(state.products.page-1)*state.products.limit+1} – ${Math.min(state.products.page*state.products.limit,d.total)} trong tổng số ${fmtNum(d.total)} sản phẩm</div>
      <div class="product-grid">
        ${d.products.map(p=>`
          <div class="product-card" onclick="showProductDetail('${p.product_id}')">
            <div class="p-img">
              ${p.image_url?`<img src="${p.image_url}">`:'📦'}
              ${calcDiscount(p)>0?`<div class="p-discount-badge">-${calcDiscount(p)}%</div>`:''}
              <div class="p-favorite" id="fav-${p.product_id}" onclick="event.stopPropagation();toggleFav('${p.product_id}')">♡</div>
              <div class="p-cart" onclick="event.stopPropagation();sendInteraction('${p.product_id}','add_to_cart')">🛒</div>
            </div>
            <div class="p-body">
              <div class="p-name">${p.name||p.product_id}</div>
              <div class="p-rating"><span style="color:var(--amber)">${stars(getRating(p))}</span></div>
              <div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px;">
                ${p.original_price&&p.original_price>p.price?`<span class="p-original-price">${fmtPrice(p.original_price)}</span>`:''}
                <span class="p-price">${fmtPrice(p.price)}</span>
              </div>
            </div>
          </div>`).join('')}
      </div>
      ${renderPagination(d.page, d.total_pages)}
    `;
  } catch(e) {
    area.innerHTML = `<div class="card"><div class="card-body">${emptyState('Lỗi',e.message)}</div></div>`;
  }
}

function renderPagination(page, total) {
  if(total<=1) return '';
  let html = `<div class="pagination"><button class="page-btn" onclick="goPage(${page-1})" ${page<=1?'disabled':''}>‹</button>`;
  for(let i=1;i<=total;i++) {
    if(i===1||i===total||(i>=page-2&&i<=page+2)) html+=`<button class="page-btn ${i===page?'active':''}" onclick="goPage(${i})">${i}</button>`;
    else if(i===page-3||i===page+3) html+=`<span class="page-info">…</span>`;
  }
  html+=`<button class="page-btn" onclick="goPage(${page+1})" ${page>=total?'disabled':''}>›</button></div>`;
  return html;
}
function goPage(p)      { state.products.page=p; fetchProducts(); window.scrollTo(0,0); }
function toggleFav(pid) { const el=document.getElementById(`fav-${pid}`); if(el){el.classList.toggle('liked'); sendInteraction(pid,'favorite');} }

async function submitInteraction() {
  const userId    = document.getElementById('int-user')?.value.trim();
  const productId = document.getElementById('int-product')?.value.trim();
  const action    = document.getElementById('int-action')?.value;
  const rating    = action==='review' ? parseFloat(document.getElementById('int-rating')?.value) : undefined;
  if(!userId||!productId) { toast('Vui lòng nhập đầy đủ thông tin','error'); return; }
  try {
    await api('/api/interactions', { method:'POST', body:JSON.stringify({ user_id:userId, product_id:productId, action, rating, source:'frontend' }) });
    toast(`Ghi nhận hành vi "${action}" thành công`);
    const log = document.getElementById('int-log');
    if (log) {
      if (log.querySelector('.empty-state')) log.innerHTML = '<div style="background:white; border-radius:var(--radius); overflow:hidden;"></div>';
      const item = document.createElement('div');
      item.style.cssText = 'padding:16px 20px;border-bottom:1px solid var(--border);animation:fadeIn 0.3s ease; background: white; display: flex; flex-direction: column; gap: 4px;';
      item.innerHTML = `<div style="font-size:14px;color:var(--text-0);font-weight:600; text-transform: uppercase;">${action}</div>
      <div style="font-size:13px;color:var(--text-1);">Sản phẩm: <span style="font-family:var(--font-mono);font-weight:600;color:var(--violet);">${productId}</span></div>
      <div style="font-size:12px;color:var(--text-3);font-family:var(--font-mono); margin-top:4px;">Lúc: ${new Date().toLocaleTimeString('vi-VN')}</div>`;
      log.querySelector('div')?.prepend(item);
    }
  } catch(e) { toast('Lỗi: '+e.message,'error'); }
}

    document.getElementById('db-dot').className = 'status-dot online';
    document.getElementById('db-info').textContent = `${fmtNum(d.totals?.products||0)} docs`;
    state.categories = (d.categories||[]).map(c=>c.name).filter(Boolean);
  } catch(e) {
    document.getElementById('ml-dot').className = 'status-dot offline';
    document.getElementById('db-dot').className = 'status-dot offline';
    document.getElementById('db-info').textContent = 'Lỗi kết nối';
  }
}

  if (!e.target.closest('.autocomplete-wrap'))
    document.querySelectorAll('.autocomplete-dropdown').forEach(d=>d.style.display='none');
});
